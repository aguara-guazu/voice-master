<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>voice-master</title>
    <link rel="stylesheet" href="xterm.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="bar">
      <div id="tabs"></div>
      <button id="new-tab" title="Nueva pestaña">+</button>
      <div id="layout-controls">
        <button id="toggle-pin" title="Fijar la sesión maestra en vista dividida">◆</button>
        <button id="toggle-orientation" title="Lado a lado / arriba y abajo">⬌</button>
        <button id="toggle-notify" title="Avisar a la sesión maestra cuando pasa algo">◉</button>
      </div>
      <div id="status"></div>
    </header>
    <main id="panes">
      <div id="divider" title="Arrastrar para redimensionar"></div>
    </main>
    <script src="index.js"></script>
  </body>
</html>
