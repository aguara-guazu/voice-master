<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>voice-master</title>
    <link rel="stylesheet" href="xterm.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="bar">
      <div id="tabs"></div>
      <button id="new-tab" title="New tab">+</button>
      <div id="layout-controls">
        <button id="toggle-pin" title="Pin the master session in split view">◆</button>
        <button id="toggle-orientation" title="Side by side / stacked">⬌</button>
        <button id="toggle-notify" title="Notify the master session when something happens">◉</button>
        <button id="toggle-voice" title="Click to start a voice conversation with the master session — it re-arms after each reply until you click it off">⏺</button>
      </div>
      <div id="status"></div>
    </header>
    <main id="panes">
      <div id="divider" title="Drag to resize"></div>
    </main>
    <script src="index.js"></script>
  </body>
</html>
